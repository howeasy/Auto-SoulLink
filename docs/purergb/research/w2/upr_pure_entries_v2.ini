; --- RESOLVED #7+#9: HiddenItemRoutine / SpecialMapPointerTable / SpecialMapList (see REPORT §4) ---
; pureRGB keeps the vanilla "hidden event" mechanism (per-map 6-byte rows:
; Y, X, item@+2, bank@+3, ptr@+4/+5, $FF-terminated) under new names:
;   SpecialMapList        = HiddenEventMaps       (map-id list, $FF-terminated)
;   SpecialMapPointerTable = HiddenEventPointers   (parallel dw pointer array)
; Byte-for-byte verified match of UPR's existing loadMapNames-style walk in
; getItemOffsets() (upr_Gen1RomHandler.java:2483-2504). HiddenItemRoutine
; should point at HiddenItems (the base multi-item-pickup entry point);
; NOTE: 3 sibling entry points (HiddenItems2/3/5, 8 bytes apart) also occur
; as targets in HiddenEventPointers records and are NOT matched by a single
; hiRoutine == comparison -- HANDLER PATCH needed: check membership in
; {0x77352, 0x7735A, 0x77362, 0x7736A} instead of equality with one value,
; or hidden items whose record targets HiddenItems2/3/5 (multi-pickup spots)
; will be silently skipped by the randomizer.
; Separately: the s2 draft's candidate "HiddenItemNear @ 0x74872" is a
; DIFFERENT, incompatible mechanism -- pureRGB's overworld Itemfinder-only
; hidden items (HiddenItemCoords @ 0x773A8, 3-byte [map,y,x] rows, NO item
; field) with the item constant set inline per-map before calling
; HiddenItems/2/3/5 via wHiddenEventFunctionArgument. That path is NOT
; centrally patchable and is out of scope for a clean INI key; leave alone.
HiddenItemRoutine=0x77352
SpecialMapPointerTable=0x472B9
SpecialMapList=0x47260

StaticPokemonSupport=1
; --- StaticPokemon{} -- FULLY RESOLVED this pass, see REPORT §1 for the byte dumps ---
; Simple immediate-write form (species then level, or level then species,
; both plain `ld a,X / ld [addr],a` pairs -- UPR's writer just pokes the
; immediate byte regardless of which WRAM address it targets):
;   Snorlax (Route 12)      species=0x59654 level=0x59659
;   Snorlax (Route 16)      species=0x59a41 level=0x59a46
;   MissingNo               level=0x759d0   species=0x759d5   (level written FIRST)
;   Mewtwo                  species=0x46166 level=0x4616b     (via wEngagedTrainerClass/Set, see note below)
;   Zapdos (PowerPlantRoof) species=0x1ab63 level=0x1ab68     (via wEngagedTrainerClass/Set; LINKED to the object-table Zapdos below, patch both)
;   Articuno                species=0x46923 level=0x46928     (via wEngagedTrainerClass/Set)
;   Moltres (volcano var.)  species=0x4b730 level=0x4b735     (via wEngagedTrainerClass/Set)
;   Volcano Magmar          species=0x4b4bc level=0x4b4c1     (via wEngagedTrainerClass/Set)
;   Cloyster                species=0x4452e level=0x44533     (via wEngagedTrainerClass/Set)
; Mewtwo/Zapdos/Articuno/Moltres(volcano)/Magmar/Cloyster all go through
; InitBattleEnemyParameters (home/trainers.asm:202): it copies
; wEngagedTrainerClass->wCurOpponent, and since these species values are all
; < OPP_ID_OFFSET (197=0xC5) it treats wEngagedTrainerSet as the level and
; copies it to wCurEnemyLevel. UPR's static writer CAN target these -- they
; are ordinary immediate-byte writes, just at a different WRAM target than
; wCurOpponent/wCurEnemyLevel; no handler logic change needed, only new
; offsets in the list.
StaticPokemonGhostMarowak{}=species@0x60a5b level@0x60a60   ; RESTLESS_SOUL=MAROWAK(0x91), level 30, PokemonTower6F.asm
; Object-table (map data, not code) form -- classic vanilla
; object_event-trailing-species/level encoding
; [sprite, y+4, x+4, move, dir, text|TRAINER, species, level], 8 bytes/row.
; This is UPR's normal static-Pokemon shape (same as vanilla's Old
; Man/PowerPlantRoof Zapdos); just needs the offsets added:
;   Voltorb (PowerPlant obj 1)   species@0x1ed6e level@0x1ed6f
;   Voltorb (PowerPlant obj 2)   species@0x1ed76 level@0x1ed77
;   Voltorb (PowerPlant obj 3)   species@0x1ed7e level@0x1ed7f
;   Electrode (PowerPlant obj 1) species@0x1ed86 level@0x1ed87
;   Voltorb (PowerPlant obj 4)   species@0x1ed8e level@0x1ed8f
;   Voltorb (PowerPlant obj 5)   species@0x1ed96 level@0x1ed97
;   Electrode (PowerPlant obj 2) species@0x1ed9e level@0x1ed9f
;   Voltorb (PowerPlant obj 6)   species@0x1eda6 level@0x1eda7
;   Zapdos (PowerPlant floor obj)species@0x1edae level@0x1edaf  ; LINKED to the PowerPlantRoof inline pair above -- both encode the same Zapdos and should be patched together for sprite/cry consistency
;   Moltres (VictoryRoad2F obj)  species@0x516c3 level@0x516c4  ; the "trainer header" form in the task brief is cosmetic wrapping (TalkToTrainer end/after-battle text) around this same object_event record; the species/level live in the object table, not the trainer header
