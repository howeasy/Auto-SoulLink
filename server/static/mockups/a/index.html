<!DOCTYPE html>
<!--
  Track A — the merged SLink UI, on the stack the project already vendors: Alpine 3, the
  real slink.css tokens, no build step, no new dependency.

  The board is the page. A soul link's unit is the pair — two mons bound across two
  cartridges, both of which die if either faints — so each row is a pair: A's half, the
  bond, B's half, both HP bars facing each other, the row tinted by the pair's weaker
  half. Rows group by state: waiting for the other half, in party, split (one half boxed,
  which the sync rules care about), boxed, fallen. Boxes and the memorial are sections of
  this, not other pages.

  The manager is the rail and the run header: new run, start, stop, pin, archive, delete,
  launchers, ports. A run that has never had a player connect says so instead of showing
  someone else's data; a stopped run shows only what was persisted — the links — which
  is exactly what the Manager has for it today.

  Everything rendered comes from ../fixtures/, generated off a running server.
  See docs/ui_mockup_brief.md.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SLink — Track A mockup</title>
  <link rel="stylesheet" href="/static/slink.css">
  <link rel="stylesheet" href="/static/themes/default.css" id="slink-theme">
  <link rel="stylesheet" href="mockup.css">
  <link rel="stylesheet" href="fonts.css">
  <script src="/static/vendor/overlay-helpers.js" defer></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
  <script src="mockup.js"></script>
</head>
<body class="mk-body-root theme-default ui-plex">

<div class="mk" x-data="mockup()" x-init="setup()" x-cloak @click="launchersOpen = false">

  <!-- ══ Rail: the manager's run list, then the destinations ═══════════════ -->
  <aside class="mk-rail">
    <div class="mk-rail-brand">
      <svg viewBox="0 0 595.3 594.1" aria-hidden="true">
        <path fill="currentColor" opacity=".85" d="M297.6,380.9c-40.4,0-74.1-28.6-82.1-66.6H81.1c9.5,110.5,102.2,197.2,215.1,197.2s205.7-86.7,215.1-197.2H379.7C371.7,352.4,338,380.9,297.6,380.9z"/>
        <path fill="#FF1C1C" d="M297.7,213.2c40.4,0,74.1,28.6,82.1,66.6h134.4C504.7,169.2,412,82.5,299,82.5S93.4,169.2,83.9,279.7h131.7C223.6,241.7,257.3,213.2,297.7,213.2z"/>
        <path fill="currentColor" d="M297.6,41.3C156.4,41.3,41.9,155.8,41.9,297s114.5,255.7,255.7,255.7S553.4,438.3,553.4,297S438.9,41.3,297.6,41.3z M297.6,511.6c-113,0-205.7-86.7-215.1-197.2h134.4c8,38,41.7,66.6,82.1,66.6s74.1-28.6,82.1-66.6h131.7C503.3,424.8,410.6,511.6,297.6,511.6z"/>
      </svg>
      <span class="mk-rail-brandtext"><b>SOUL LINK</b><span>Track A · Alpine</span></span>
    </div>

    <button class="mk-rail-item new" :class="dest === 'new' ? 'active' : ''" @click="newRun()">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M7 2h2v5h5v2H9v5H7V9H2V7h5z"/></svg>
      <span class="mk-rail-label">New run</span>
    </button>

    <template x-for="group in ['running', 'stopped', 'archived']" :key="group">
      <template x-for="r in runsByStatus(group)" :key="r.run_id">
        <button class="mk-rail-item" :class="r.run_id === activeRunId && dest === 'run' ? 'active' : ''" @click="selectRun(r.run_id)">
          <span class="mk-dot" :class="r.status"></span>
          <span class="mk-rail-label" x-text="r.name"></span>
          <span class="mk-rail-pin" x-show="r.run_id === pinnedRunId" title="pinned for stream">◉</span>
        </button>
      </template>
    </template>

    <hr class="mk-rail-sep">

    <button class="mk-rail-item" :class="dest === 'broadcast' ? 'active' : ''" @click="dest = 'broadcast'">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M5 1h2v2H5zM9 1h2v2H9zM1 4h14v10H1zM6 6v6l5-3z"/></svg>
      <span class="mk-rail-label">Broadcast</span>
    </button>
    <button class="mk-rail-item" :class="dest === 'tools' ? 'active' : ''" @click="dest = 'tools'">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M11 1a4 4 0 00-3.8 5.2L1 12.4 3.6 15l6.2-6.2A4 4 0 1011 1zm0 2a2 2 0 110 4 2 2 0 010-4z"/></svg>
      <span class="mk-rail-label">Tools</span>
    </button>
    <a class="mk-rail-item" href="/calc/normal.html" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 1h12v14H2zM4 3v3h8V3zM4 7v2h2V7zm3 0v2h2V7zm3 0v2h2V7zM4 10v2h2v-2zm3 0v2h2v-2zm3 0v5h2v-5z"/></svg>
      <span class="mk-rail-label">Calc ↗</span>
    </a>
    <button class="mk-rail-item" @click="debugOpen = true">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6 1l1 2h2l1-2 1 1-1 2h1v1h2v2h-2v2h2v2h-2v1l-3 2-3-2v-1H3v-2h2V9H3V7h2V5h1L5 3z"/></svg>
      <span class="mk-rail-label">Debug <kbd>`</kbd></span>
    </button>
  </aside>

  <!-- ══ Main ═════════════════════════════════════════════════════════════ -->
  <main class="mk-main">

    <template x-if="error"><div class="mk-body"><div class="mk-note" x-text="error"></div></div></template>
    <template x-if="loading"><div class="mk-body"><div class="mk-empty">Loading fixtures…</div></div></template>

    <!-- ── NEW RUN — the manager's creation form ────────────────────────── -->
    <template x-if="!loading && !error && dest === 'new'">
      <div style="display:contents">
        <header class="mk-runhdr"><h1 class="mk-runname">New run</h1></header>
        <div></div>
        <div class="mk-body">
          <div class="mk-form">
            <label class="mk-field"><span>Name</span><input class="big" type="text" x-model="draft.name" placeholder="Kanto Duo" @keydown.enter="createRun()"></label>
            <template x-for="[label, keys] in OPTION_GROUPS" :key="label">
              <div class="mk-group">
                <span class="mk-cap" x-text="label"></span>
                <div class="mk-opts">
                  <template x-for="key in keys" :key="key">
                    <label class="mk-opt" :class="draft.opts[key] ? 'on' : ''">
                      <input type="checkbox" x-model="draft.opts[key]">
                      <span x-text="OPTION_LABELS[key]"></span>
                    </label>
                  </template>
                </div>
              </div>
            </template>
            <div><button class="mk-btn primary" :disabled="!draft.name.trim()" @click="createRun()">Create run</button></div>
          </div>
        </div>
      </div>
    </template>

    <!-- ── RUN ──────────────────────────────────────────────────────────── -->
    <template x-if="!loading && !error && dest === 'run' && run().run_id">
      <div style="display:contents">
        <header class="mk-runhdr">
          <h1 class="mk-runname" x-text="run().name"></h1>
          <span class="mk-pill" :class="run().status" x-text="run().status"></span>
          <span class="mk-meta"><code x-text="'tcp ' + run().tcp_port + ' · http ' + run().http_port"></code></span>
          <span class="mk-hdr-spacer"></span>
          <span class="mk-meta" x-show="status().attempts_count">Attempt <b x-text="status().attempts_count"></b></span>
          <button class="mk-btn primary" x-show="run().status !== 'running'" @click="act('start')">Start</button>
          <button class="mk-btn" x-show="run().status === 'running'" @click="act('stop')">Stop</button>
          <button class="mk-btn" :class="isPinned() ? 'active' : ''" x-show="run().status === 'running'" @click="act('pin')" x-text="isPinned() ? 'Pinned' : 'Pin'"></button>
          <span class="mk-pop-anchor" @click.stop>
            <button class="mk-btn" @click="launchersOpen = !launchersOpen">Launchers ▾</button>
            <div class="mk-pop" x-show="launchersOpen">
              <span class="mk-cap">BizHawk Lua launchers</span>
              <button class="mk-btn" x-text="'Player A · slink_' + (run().safe_name || run().run_id) + '_a.lua'"></button>
              <button class="mk-btn" x-text="'Player B · slink_' + (run().safe_name || run().run_id) + '_b.lua'"></button>
              <span class="mk-cap">Load the save first; then the script. It connects to <code x-text="'tcp ' + run().tcp_port"></code>.</span>
            </div>
          </span>
          <button class="mk-btn" x-show="run().status !== 'archived'" @click="act('archive')">Archive</button>
          <button class="mk-btn danger" @click="act('delete')">Delete</button>

          <div class="mk-pchips">
            <template x-for="pid in ['a', 'b']" :key="pid">
              <div class="mk-pchip" :class="connected(pid) ? 'online' : 'offline'">
                <span class="mk-side" x-text="pid.toUpperCase()"></span>
                <span class="mk-pchip-name">
                  <span x-text="player(pid).trainer_name || 'not connected'"></span>
                  <span class="mk-pchip-game" x-show="player(pid).rom_type" x-text="' · ' + player(pid).rom_type"></span>
                </span>
                <span class="mk-pchip-badges" x-show="hasData(pid)">
                  <template x-for="i in badgeSlots(pid)" :key="i"><span class="mk-badge-pip" :class="i <= badgeCount(pid) ? 'on' : ''"></span></template>
                </span>
                <span class="mk-pchip-meta" x-show="hasData(pid)">
                  <b x-text="player(pid).current_area_display"></b>
                  <span><b x-text="player(pid).ball_count"></b> balls</span>
                  <template x-if="battle(pid).in_battle"><span class="mk-tag status">in battle</span></template>
                  <template x-if="!connected(pid) && isLive()"><span class="mk-tag off">disconnected</span></template>
                </span>
                <span class="mk-pchip-meta" x-show="!hasData(pid) && isLive()">waiting for hello</span>
              </div>
            </template>
          </div>
        </header>

        <nav class="mk-tabs">
          <button class="mk-tab" :class="tab === 'board' ? 'active' : ''" @click="tab = 'board'">
            Board <span class="mk-tab-count" x-text="counts().alive + (counts().fallen ? ' · ' + counts().fallen + ' fallen' : '')"></span>
          </button>
          <button class="mk-tab" :class="tab === 'setup' ? 'active' : ''" @click="tab = 'setup'">Setup</button>
        </nav>

        <!-- ── Board ──────────────────────────────────────────────────── -->
        <template x-if="tab === 'board'">
          <div class="mk-runbody">
            <div class="mk-card mk-board">
              <template x-if="!sections().length">
                <div class="mk-empty">
                  <template x-if="run().created_in_mock || !status().links.length">
                    <span>No links yet. Download the launchers, load each save, then load the script — the first catch in a shared area starts the board.</span>
                  </template>
                </div>
              </template>

              <template x-for="[sect, rows] in sections()" :key="sect">
                <div>
                  <div class="mk-sect">
                    <span class="mk-cap" x-text="SECTION_LABELS[sect]"></span>
                    <span class="mk-sect-n" x-text="rows.length"></span>
                  </div>
                  <template x-for="row in rows" :key="row.area">
                    <div class="mk-pair" :class="[row.section === 'fallen' ? 'fallen' : '', row.atRisk ? 'at-risk' : '']">

                      <template x-for="pid in ['a', 'b']" :key="pid">
                        <div class="mk-half" :class="[pid, row[pid] ? '' : 'empty']">
                          <template x-if="row[pid]">
                            <span class="mk-half-sprite" x-html="row[pid].sprite"></span>
                          </template>
                          <template x-if="row[pid]">
                            <span class="mk-half-txt">
                              <span class="mk-half-nick">
                                <span x-show="row[pid].active" class="mk-active" title="out in battle">⚔</span><span x-text="row[pid].nickname || row[pid].species_name"></span><span x-show="row[pid].item" class="mk-item" :title="'item #' + row[pid].item">◆</span>
                              </span>
                              <span class="mk-half-sub">
                                <span x-text="row[pid].species_name"></span> · Lv <span x-text="row[pid].level"></span>
                                <span class="abil" x-show="capsFor(pid).abilities && row[pid].ability" x-text="' · ' + row[pid].ability"></span>
                                <span class="mk-where" x-show="row[pid].where === 'box'"> · boxed</span>
                              </span>
                            </span>
                          </template>
                          <template x-if="row[pid] && row[pid].hp != null">
                            <span class="mk-hp">
                              <span class="mk-hp-num" x-text="row[pid].hp + '/' + row[pid].maxHP"></span>
                              <span class="mk-hp-bar"><span class="mk-hp-fill" :class="hpClass(row[pid])" :style="'width:' + hpPct(row[pid]) + '%'"></span></span>
                            </span>
                          </template>
                          <template x-if="!row[pid]">
                            <span x-text="row.status === 'dead_zone' ? 'missed' : row.section === 'pending' ? 'waiting for ' + (player(pid).trainer_name || pid.toUpperCase()) : '—'"></span>
                          </template>
                        </div>
                      </template>

                      <!-- The bond. Rendered between the halves by CSS grid order. -->
                      <div class="mk-bond" style="grid-column:2;grid-row:1">
                        <span class="mk-bond-glyph" :class="row.status" x-text="bondGlyph(row.status)"></span>
                        <span class="mk-bond-area" x-text="row.areaName"></span>
                        <span class="mk-risk" x-show="row.atRisk" x-text="row.risk + '% — at risk'"></span>
                        <template x-if="row.death">
                          <span class="mk-bond-why" x-text="row.death.cause + (row.death.killer ? ' · ' + (row.death.killer.trainer_name || row.death.killer.species_name) : '')"></span>
                        </template>
                        <span class="mk-bond-why" x-show="row.status === 'dead_zone'">dead zone</span>
                      </div>
                    </div>
                  </template>
                </div>
              </template>

              <!-- Boxed mons that belong to no bond: one line per side, not pair rows,
                   because there is no pair. -->
              <template x-if="unlinkedBoxed('a').length || unlinkedBoxed('b').length">
                <div>
                  <div class="mk-sect"><span class="mk-cap">Boxed, unlinked</span></div>
                  <div class="mk-pair" style="align-items:start">
                    <template x-for="pid in ['a', 'b']" :key="pid">
                      <div class="mk-half" :class="pid" style="grid-template-columns:minmax(0,1fr)">
                        <span class="mk-half-txt">
                          <template x-for="b in unlinkedBoxed(pid)" :key="b.key">
                            <span class="mk-half-sub"><span style="color:var(--c-txt)" x-text="b.nickname"></span> · box <span x-text="b.box + 1"></span>·<span x-text="b.slot + 1"></span></span>
                          </template>
                        </span>
                      </div>
                    </template>
                    <div class="mk-bond" style="grid-column:2;grid-row:1"><span class="mk-bond-glyph" style="color:var(--c-dim)">··</span></div>
                  </div>
                </div>
              </template>
            </div>

            <!-- Side strip: what each player is doing right now, and the feed. Absent
                 entirely when nothing is live — a stopped run has none of this. -->
            <div class="mk-strip" x-show="isLive() && anyData()">
              <template x-for="pid in ['a', 'b']" :key="pid">
                <div class="mk-card mk-pstrip" x-show="hasData(pid)">
                  <span class="mk-side" x-text="pid.toUpperCase()"></span>
                  <div>
                    <template x-if="battle(pid).in_battle">
                      <div>
                        <template x-for="foe in (battle(pid).enemy_party || [])" :key="foe.key || foe.species_id">
                          <div class="mk-foe">
                            <span class="mk-half-sprite" x-html="foe.sprite_html"></span>
                            <span class="mk-half-txt">
                              <span class="mk-half-nick" x-text="(battle(pid).is_trainer_battle ? (battle(pid).opponent_name || 'Trainer') + '’s ' : 'wild ') + foe.species_name"></span>
                              <span class="mk-half-sub" x-text="'Lv ' + foe.level"></span>
                            </span>
                            <span class="mk-hp">
                              <span class="mk-hp-num" x-text="foe.hp + '/' + foe.maxHP"></span>
                              <span class="mk-hp-bar"><span class="mk-hp-fill" :class="hpClass(foe)" :style="'width:' + hpPct(foe) + '%'"></span></span>
                            </span>
                          </div>
                        </template>
                      </div>
                    </template>
                    <span class="mk-cap" x-show="wild(pid).length">Wild here</span>
                    <template x-for="[method, list] in wild(pid)" :key="method">
                      <div class="mk-wild-row">
                        <span class="mk-tag" x-text="method"></span>
                        <span x-text="[...new Set(list.map(e => e.name || e.species_name || e.species))].slice(0, 7).join(', ')"></span>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
              <div class="mk-card mk-feed">
                <template x-for="(e, i) in events(40)" :key="i">
                  <div class="mk-ev"><span class="mk-ev-ts" x-text="shortTs(e.ts)"></span><span class="mk-ev-who" x-text="(e.player || '').toUpperCase()"></span><span x-text="e.text"></span></div>
                </template>
              </div>
            </div>
          </div>
        </template>

        <!-- ── Setup ──────────────────────────────────────────────────── -->
        <template x-if="tab === 'setup'">
          <div class="mk-body">
            <div class="mk-card">
              <div class="mk-card-hdr"><b>Rules</b><span class="mk-hdr-spacer"></span><span x-show="!gameId('a')" class="mk-cap">what each can honour is known once a cartridge connects</span></div>
              <div class="mk-card-body mk-opts">
                <template x-for="key in Object.keys(OPTION_LABELS)" :key="key">
                  <label class="mk-opt" :class="!optionState(key).ok ? 'off-unavailable' : (optionState(key).on ? 'on' : '')">
                    <input type="checkbox" :checked="optionState(key).on && optionState(key).ok" :disabled="!optionState(key).ok">
                    <span x-text="OPTION_LABELS[key]"></span>
                    <span class="mk-opt-why" x-show="!optionState(key).ok" x-text="optionState(key).why"></span>
                  </label>
                </template>
              </div>
            </div>
            <div class="mk-card">
              <div class="mk-card-hdr"><b>Randomized ROM pair</b></div>
              <div class="mk-card-body" style="display:flex;flex-direction:column;gap:var(--space-3)">
                <div class="mk-opts">
                  <label class="mk-field"><span>Randomizer jar</span><input type="text" placeholder="path to PokeRandoZX.jar"></label>
                  <label class="mk-field"><span>Settings file</span><input type="text" placeholder="path to your .rnqs"></label>
                  <label class="mk-field"><span>Player A clean ROM</span><input type="text" placeholder="path to a clean .gb"></label>
                  <label class="mk-field"><span>Player B clean ROM</span><input type="text" placeholder="path to a clean .gb"></label>
                </div>
                <div><button class="mk-btn primary">Build randomized pair</button></div>
                <table class="mk-tbl" x-show="player('a').rom_type">
                  <thead><tr><th>Player</th><th>Cartridge</th><th>Seed</th><th>ROM SHA1</th></tr></thead>
                  <tbody>
                    <template x-for="pid in ['a', 'b']" :key="pid">
                      <tr>
                        <td x-text="pid.toUpperCase() + ' · ' + (player(pid).trainer_name || '—')"></td>
                        <td><span class="mk-tag" x-text="player(pid).rom_type"></span></td>
                        <td><code x-text="pid === 'a' ? '4815162342' : '9081726354'"></code></td>
                        <td><code x-text="pid === 'a' ? 'a3f19c7d2e04' : 'c72b0e4a91f8'"></code></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
            <div class="mk-card">
              <div class="mk-card-hdr"><b>Run</b></div>
              <table class="mk-tbl"><tbody>
                <tr><td>Created</td><td x-text="run().created_short"></td></tr>
                <tr><td>Ports</td><td><code x-text="'tcp ' + run().tcp_port + ' · http ' + run().http_port"></code></td></tr>
                <tr><td>Data</td><td><code x-text="'data/runs/' + run().run_id + '/'"></code></td></tr>
              </tbody></table>
            </div>
          </div>
        </template>
      </div>
    </template>

    <template x-if="!loading && !error && dest === 'run' && !run().run_id">
      <div class="mk-body"><div class="mk-empty">No runs. Create one.</div></div>
    </template>

    <!-- ── BROADCAST ────────────────────────────────────────────────────── -->
    <template x-if="!loading && !error && dest === 'broadcast'">
      <div style="display:contents">
        <header class="mk-runhdr"><h1 class="mk-runname">Broadcast</h1><span class="mk-hdr-spacer"></span>
          <span class="mk-meta" x-show="pinnedRun()">overlays show <b x-text="pinnedRun() && pinnedRun().name"></b></span>
          <span class="mk-meta" x-show="!pinnedRun()">no run pinned — overlays are blank</span>
        </header>
        <div></div>
        <div class="mk-body" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));align-content:start">
          <div class="mk-card">
            <div class="mk-card-hdr"><b>Overlays</b><span class="mk-hdr-spacer"></span><span>25 sources</span></div>
            <div class="mk-card-body mk-opts">
              <template x-for="o in ['party-a','party-b','links','linked-party','boxed-links','deaths','encounters','badges-a','badges-b','ticker']" :key="o">
                <span class="mk-opt"><code x-text="'/stream/' + o"></code></span>
              </template>
            </div>
          </div>
          <div class="mk-card">
            <div class="mk-card-hdr"><b>Twitch bot</b></div>
            <div class="mk-card-body" style="display:flex;flex-direction:column;gap:var(--space-2)">
              <label class="mk-field"><span>Channel</span><input type="text" value="howeasy"></label>
              <label class="mk-field"><span>Command prefix</span><input type="text" value="!"></label>
              <div><button class="mk-btn primary">Enable</button></div>
            </div>
          </div>
          <div class="mk-card">
            <div class="mk-card-hdr"><b>OBS scene triggers</b></div>
            <table class="mk-tbl">
              <thead><tr><th>Event</th><th>Player</th><th>Scene</th></tr></thead>
              <tbody>
                <template x-for="t in [['faint','any','Death Cam'],['capture','a','Player A Full'],['trainer_battle_start','any','Battle']]" :key="t[0]">
                  <tr><td x-text="t[0]"></td><td x-text="t[1]"></td><td x-text="t[2]"></td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </template>

    <!-- ── TOOLS ────────────────────────────────────────────────────────── -->
    <template x-if="!loading && !error && dest === 'tools'">
      <div style="display:contents">
        <header class="mk-runhdr"><h1 class="mk-runname">Tools</h1></header>
        <div></div>
        <div class="mk-body" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));align-content:start">
          <div class="mk-card">
            <div class="mk-card-hdr"><b>Companion ROM patch</b></div>
            <div class="mk-card-body" style="display:flex;flex-direction:column;gap:var(--space-2)">
              <label class="mk-field"><span>Base ROM</span><input type="file"></label>
              <div><button class="mk-btn primary">Apply patch</button></div>
              <span class="mk-cap">Applies in your browser. The ROM never leaves this machine.</span>
            </div>
          </div>
          <div class="mk-card">
            <div class="mk-card-hdr"><b>Randomized pair</b></div>
            <div class="mk-card-body"><button class="mk-btn" @click="dest = 'run'; tab = 'setup'">Open in run setup</button></div>
          </div>
        </div>
      </div>
    </template>
  </main>

  <!-- ══ Debug drawer ═════════════════════════════════════════════════════ -->
  <template x-if="debugOpen">
    <div>
      <div class="mk-scrim" @click="debugOpen = false"></div>
      <aside class="mk-drawer">
        <header class="mk-drawer-hdr"><b>Debug</b><span class="mk-hdr-spacer"></span><span class="mk-cap"><kbd>`</kbd> toggles · <kbd>Esc</kbd> closes</span><button class="mk-btn" @click="debugOpen = false">Close</button></header>
        <div class="mk-drawer-body">
          <div class="mk-drawer-grid">
            <template x-for="a in ['Inject event','Queue command','Set Pokéballs','Set area state','Clear pending','Unlink','Revive','Rollback backup']" :key="a"><button class="mk-btn" x-text="a"></button></template>
          </div>
          <div class="mk-card"><table class="mk-tbl"><tbody>
            <tr><td>run</td><td><code x-text="run().run_id"></code></td></tr>
            <tr><td>game_id</td><td><code x-text="(gameId('a') || '—') + ' / ' + (gameId('b') || '—')"></code></td></tr>
            <tr><td>rom_type</td><td><code x-text="(player('a').rom_type || '—') + ' / ' + (player('b').rom_type || '—')"></code></td></tr>
            <tr><td>links</td><td x-text="status().links.length"></td></tr>
            <tr><td>dead zones</td><td x-text="deadZones().join(', ') || '—'"></td></tr>
            <tr><td>queued cmds</td><td x-text="player('a').queued + ' / ' + player('b').queued"></td></tr>
            <tr><td>save_failed</td><td x-text="status().save_failed || 'no'"></td></tr>
          </tbody></table></div>
        </div>
      </aside>
    </div>
  </template>

  <!-- The dashed box is the only part of this page that would not ship. -->
  <details class="mk-ctl" open>
    <summary>Mockup controls</summary>
    <span class="mk-ctl-lbl">Cartridge</span>
    <button class="mk-chip" :class="gen === 'gen3' ? 'active' : ''" @click="loadGen('gen3')">Gen 3 RR</button>
    <button class="mk-chip" :class="gen === 'gen1' ? 'active' : ''" @click="loadGen('gen1')">Gen 1 R/B</button>
    <span class="mk-ctl-lbl">Density</span>
    <button class="mk-chip" :class="!compact ? 'active' : ''" @click="compact = false; syncDensity()">Comfortable</button>
    <button class="mk-chip" :class="compact ? 'active' : ''" @click="compact = true; syncDensity()">Compact</button>
    <span class="mk-ctl-lbl">Body font</span>
    <template x-for="f in FONTS" :key="f[0]"><button class="mk-chip" :class="font === f[0] ? 'active' : ''" @click="applyFont(f[0])" :style="'font-family:' + f[2]" x-text="f[1]"></button></template>
    <span class="mk-ctl-lbl">Theme</span>
    <template x-for="t in THEMES" :key="t[0]"><button class="mk-chip sw" :class="theme === t[0] ? 'active' : ''" @click="applyTheme(t[0])" :title="t[1]"><span class="sw-dot" :style="'background:' + t[2]"></span><span x-text="t[1]"></span></button></template>
  </details>

</div>

<style>[x-cloak] { display: none !important; }</style>
</body>
</html>
