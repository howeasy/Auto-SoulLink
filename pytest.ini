[pytest]
testpaths = tests
# Fail on an unregistered marker instead of silently treating a typo'd @pytest.mark.foo
# as a no-op. Every marker the suite uses must appear below.
addopts = --strict-markers
asyncio_mode = strict
# Many tests copy ROMs into tmp_path (the UPR option matrix writes two per test): pytest's default
# keeps every test's tmp_path for the last 3 runs, which filled C: (~7 GB per full run) on
# 2026-09-27. Keep only failing tests' tmp dirs as evidence.
tmp_path_retention_policy = failed
asyncio_default_fixture_loop_scope = function
markers =
    live: needs EmuHawk + the patched RR ROM + a current savestate (SLINK_LIVE=1)
    e2e: needs TWO EmuHawk instances and a throwaway server (SLINK_E2E=1)
    slow: takes more than a few seconds
filterwarnings =
    ignore::DeprecationWarning:twitchio.*
    # aiohttp advises web.AppKey over plain string keys; server/templating.py uses a string.
    ignore:.*web.AppKey.*
