name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Portable unit + integration (not release validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      # Gate on the rules that catch real breakage: syntax errors (incl. accidental
      # 3.12-only constructs, since ruff.toml targets py311), undefined names, duplicate
      # definitions and duplicate dict keys. The rest of `ruff check .` is a large
      # pre-existing style worklist that ruff.toml documents as deferred — gating on it
      # would mean a CI that is red on day one and therefore ignored.
      - name: Lint (bug-class rules)
        run: ruff check . --select E9,F6,F7,F81,F82
      - name: Lint (full, advisory)
        run: ruff check . --statistics || true
      - name: Lua syntax (all lua/**/*.lua parse under 5.4)
        run: python tools/lua_syntax_check.py
      # Every unit/integration node has an exact reviewed classification. Local
      # ROM/source/JAR and platform cases are named deferrals, never CI passes.
      # The strict local Gen 1 release runner remains a separate required gate.
      - name: Portable unit + integration tests
        run: python tools/verify_portable_ci.py
      - name: Preserve coverage and deferral report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-ci-report
          path: .cache/portable-ci/report.json
          if-no-files-found: error
